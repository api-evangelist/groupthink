aid: groupthink
name: Groupthink
description: >-
  Groupthink is a note-taker and professional-relationship memory built by
  Firstparty Labs, Inc. It sends a notetaker bot into Zoom, Google Meet, and
  Microsoft Teams meetings, transcribes and summarizes them, then organizes what
  it captures around the people involved rather than around the meetings —
  building a living relationship record with pre-meeting briefs, structured
  decisions and action items, and a daily intelligence brief of who needs
  attention. Groupthink exposes a hosted, remote Model Context Protocol (MCP)
  server at api.groupthink.com so Claude, Cursor, and other MCP-compatible AI
  assistants can join live meetings, read transcripts, speak and chat in the
  call, and query relationship intelligence using Bearer-token API tokens.
