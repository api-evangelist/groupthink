    served from api.groupthink.com. Authenticated with a Bearer API token minted
    in the app, it lets an AI assistant join live meetings, stream transcripts,
    speak and post chat in the call, save and retrieve notes, and query
    relationship intelligence (relationships, insights, upcoming and past
    meetings).
